[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-vault"
version = "0.1.0"
description = "Threat scanner and 3-level trust matrix for AI skill files. MIT-licensed port of NousResearch/hermes-agent skills_guard.py."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "AI Build Lab", email = "tyler@aibuildlab.com" }
]
keywords = ["ai", "agents", "skills", "security", "trust", "claude", "hermes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.urls]
Homepage = "https://github.com/aibuild-lab/skills-guard"
Issues = "https://github.com/aibuild-lab/skills-guard/issues"
"Upstream (Hermes)" = "https://github.com/NousResearch/hermes-agent"

[project.scripts]
skills-guard = "skill_vault.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["skill_vault*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
